<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menu</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <!-- Fonts (already set up for you) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;600;900&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">

  <!-- Tailwind (already set up for you) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    // This lets you use the classes `font-sans` (Inter Tight) and `font-serif` (Instrument Serif)
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Inter Tight"', 'sans-serif'],
            serif: ['"Instrument Serif"', 'serif'],
          },
        },
      },
    };
  </script>
</head>

<!-- TODO: give the body a background color, text color and font -->
<body>

  <!-- ===== HEADER ===== -->
  <header>
    <!-- TODO: address, hours and phone go here (from the API) -->
    <div id="restaurant-info"></div>

    <!-- TODO: the restaurant name — make it HUGE -->
    <h1 id="restaurant-name"></h1>

    <!-- TODO: the tagline — italic serif, accent color -->
    <p id="tagline"></p>
  </header>

  <!-- ===== CATEGORY NAV ===== -->
  <!-- TODO: make the nav stick to the top of the screen when you scroll -->
  <nav>
    <!-- One link per category goes in here (from the API) -->
    <ul id="category-nav"></ul>
  </nav>

  <!-- ===== MENU ===== -->
  <!-- One <section> per category goes in here (from the API) -->
  <main id="menu">
    <p id="status">Loading the menu…</p>
  </main>

  <!-- ===== FOOTER ===== -->
  <footer>
    <p id="footer-name"></p>
    <p id="footer-info"></p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
